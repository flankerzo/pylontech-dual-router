# ============================================================
# FULL JK-BMS TELEMETRY + DUAL PYLONTECH PROXY
# Native syssi JK-BMS data is exposed for inspection. Only the
# selected proxy values below are forwarded to the two inverters.
# Charge/discharge voltage limits remain manual for now.
# ============================================================

esphome:
  name: jkbms-s3-dual-proxy

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

external_components:
  - source: github://flankerzo/pylontech-dual-router@main

    refresh: always

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password



api:
  encryption:
    key: !secret jkbms_s3_dual_proxy__encryption_key


  reboot_timeout: 0min
ota:
  - platform: esphome

logger:
  level: DEBUG

# UART A connects only to the inverter's isolated RS485-to-UART module.
# UART B connects only to the BMS's isolated RS485-to-UART module.
uart:
  - id: uart_battery
    tx_pin: GPIO39
    rx_pin: GPIO40
    baud_rate: 9600
    rx_buffer_size: 512

  - id: uart_inv_1
    tx_pin: GPIO41
    rx_pin: GPIO42
    baud_rate: 9600
    rx_buffer_size: 256

  - id: uart_inv_2
    tx_pin: GPIO1
    rx_pin: GPIO2
    baud_rate: 9600
    rx_buffer_size: 256

# ---------------------------------------------------------------------------
# Pylontech-only proxy instances
# ---------------------------------------------------------------------------
# Battery port: listen to the real battery UART and inspect raw frames.
# Inverter ports: each inverter is a separate master UART.
# Success/error replies go only to the requesting inverter. Replies without
# an outstanding request are discarded; other valid frames go to both ports.
# HA update controls only rate-limit Home Assistant publishes. They never
# delay, remove, or alter RS485 frames. Zero means every received response.
pylontech_dual_proxy:
  - id: pylontech_battery
    uart_id: uart_battery
    battery_port: true
    response_timeout: 1500ms
    # Trial pause after a battery frame or timeout before sending the next request.
    request_gap: 50ms
    link_timeout: 60s
    online: battery_online
    cache_ttl: 2500ms
    update_timeout: 60s
    state_of_charge: battery_soc
    voltage: battery_voltage
    current: battery_current
    temperature: battery_temperature
    state_of_health: battery_soh
    cycle_count: battery_cycle_count
    max_cell_voltage: battery_max_cell_voltage
    min_cell_voltage: battery_min_cell_voltage
    max_temperature: battery_max_cell_temperature
    min_temperature: battery_min_cell_temperature
    mosfet_temperature: battery_mosfet_temperature
    max_mosfet_temperature: battery_max_mosfet_temperature
    min_mosfet_temperature: battery_min_mosfet_temperature
    bms_temperature: battery_bms_temperature
    max_bms_temperature: battery_max_bms_temperature
    min_bms_temperature: battery_min_bms_temperature
    max_voltage: battery_max_voltage
    min_voltage: battery_min_voltage
    max_charge_current: battery_max_charge_current
    max_discharge_current: battery_max_discharge_current
    battery_charging: battery_charging
    battery_discharging: battery_discharging
    publish_raw_frames: publish_battery_raw_frames
    publish_decoded_replies: publish_battery_decoded_replies
    last_battery_frame: battery_last_frame
    last_battery_snapshot: battery_last_snapshot
    ha_update_interval: ha_update_interval
    gsad_update_interval: gsad_update_interval
    gscd_limits_update_interval: gscd_limits_update_interval
    module_analog_update_interval: module_analog_update_interval
    system_parameters_update_interval: system_parameters_update_interval
    protocol_version_update_interval: protocol_version_update_interval
    manufacturer_info_update_interval: manufacturer_info_update_interval
    charge_management_update_interval: charge_management_update_interval
    module_serial_update_interval: module_serial_update_interval
    firmware_info_update_interval: firmware_info_update_interval

  - id: pylontech_inv_1
    uart_id: uart_inv_1
    # Address frames are preserved exactly; the physical UART identifies this inverter.
    cache_ttl: 2500ms
    update_timeout: 60s
    link_timeout: 60s
    online: inverter_1_online
    publish_raw_frames: publish_inverter_1_requests
    last_inverter_request: inverter_1_last_request

  - id: pylontech_inv_2
    uart_id: uart_inv_2
    # Address frames are preserved exactly; the physical UART identifies this inverter.
    cache_ttl: 2500ms
    update_timeout: 60s
    link_timeout: 60s
    online: inverter_2_online
    publish_raw_frames: publish_inverter_2_requests
    last_inverter_request: inverter_2_last_request

# Turn these on in HA only when diagnostic text is needed.
# Off stops new text publishes; normal telemetry and UART routing continue.
switch:
  - platform: template
    id: publish_battery_raw_frames
    name: "Publish Battery Raw Frames"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: publish_battery_decoded_replies
    name: "Publish Battery Decoded Replies"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: publish_inverter_1_requests
    name: "Publish Inverter 1 Last Request"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: template
    id: publish_inverter_2_requests
    name: "Publish Inverter 2 Last Request"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

# Set these live from Home Assistant, in seconds. The global control applies to
# all commands; per-command controls use -1 to inherit it. Zero means every
# received response. Alarms CID44/CID62 are always immediate.
number:
  - platform: template
    id: ha_update_interval
    name: "Battery HA Update Interval"
    unit_of_measurement: "s"
    min_value: 0
    max_value: 300
    step: 1
    initial_value: 0
    optimistic: true
    restore_value: true

  - platform: template
    id: gsad_update_interval
    name: "Get System Analog Data (61) Update Interval"
    unit_of_measurement: "s"
    min_value: -1
    max_value: 300
    step: 1
    initial_value: -1
    optimistic: true
    restore_value: true

  - platform: template
    id: gscd_limits_update_interval
    name: "Get Charge Discharge Limits (63) Update Interval"
    unit_of_measurement: "s"
    min_value: -1
    max_value: 300
    step: 1
    initial_value: -1
    optimistic: true
    restore_value: true

  - platform: template
    id: module_analog_update_interval
    name: "Get Module Analog Data (42) Update Interval"
    unit_of_measurement: "s"
    min_value: -1
    max_value: 300
    step: 1
    initial_value: -1
    optimistic: true
    restore_value: true

  - platform: template
    id: system_parameters_update_interval
    name: "Get System Parameters (47) Update Interval"
    unit_of_measurement: "s"
    min_value: -1
    max_value: 300
    step: 1
    initial_value: -1
    optimistic: true
    restore_value: true

  - platform: template
    id: protocol_version_update_interval
    name: "Get Protocol Version (4F) Update Interval"
    unit_of_measurement: "s"
    min_value: -1
    max_value: 300
    step: 1
    initial_value: -1
    optimistic: true
    restore_value: true

  - platform: template
    id: manufacturer_info_update_interval
    name: "Get Manufacturer Info (51) Update Interval"
    unit_of_measurement: "s"
    min_value: -1
    max_value: 300
    step: 1
    initial_value: -1
    optimistic: true
    restore_value: true

  - platform: template
    id: charge_management_update_interval
    name: "Get Charge Discharge Management (92) Update Interval"
    unit_of_measurement: "s"
    min_value: -1
    max_value: 300
    step: 1
    initial_value: -1
    optimistic: true
    restore_value: true

  - platform: template
    id: module_serial_update_interval
    name: "Get Module Serial Number (93) Update Interval"
    unit_of_measurement: "s"
    min_value: -1
    max_value: 300
    step: 1
    initial_value: -1
    optimistic: true
    restore_value: true

  - platform: template
    id: firmware_info_update_interval
    name: "Get Firmware Info (96) Update Interval"
    unit_of_measurement: "s"
    min_value: -1
    max_value: 300
    step: 1
    initial_value: -1
    optimistic: true
    restore_value: true

sensor:
  - platform: template
    id: battery_soc
    name: "Battery State of Charge"
    unit_of_measurement: "%"
    state_class: measurement
    device_class: battery
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: battery_voltage
    name: "Battery Voltage"
    unit_of_measurement: "V"
    state_class: measurement
    device_class: voltage
    accuracy_decimals: 2
    update_interval: never

  - platform: template
    id: battery_current
    name: "Battery Current"
    unit_of_measurement: "A"
    state_class: measurement
    device_class: current
    accuracy_decimals: 2
    update_interval: never

  - platform: template
    id: battery_temperature
    name: "Battery Temperature"
    unit_of_measurement: "°C"
    state_class: measurement
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: battery_soh
    name: "Battery SOH"
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: battery_cycle_count
    name: "Battery Cycle Count"
    state_class: measurement
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: battery_max_voltage
    name: "Battery Max Voltage"
    unit_of_measurement: "V"
    state_class: measurement
    device_class: voltage
    accuracy_decimals: 2
    update_interval: never

  - platform: template
    id: battery_min_voltage
    name: "Battery Min Voltage"
    unit_of_measurement: "V"
    state_class: measurement
    device_class: voltage
    accuracy_decimals: 2
    update_interval: never

  - platform: template
    id: battery_max_charge_current
    name: "Battery Max Charge Current"
    unit_of_measurement: "A"
    state_class: measurement
    device_class: current
    accuracy_decimals: 2
    update_interval: never

  - platform: template
    id: battery_max_discharge_current
    name: "Battery Max Discharge Current"
    unit_of_measurement: "A"
    state_class: measurement
    device_class: current
    accuracy_decimals: 2
    update_interval: never

  # CID2 61 exposes aggregate min/max cell values, not 16 individual cell voltages.
  - platform: template
    id: battery_max_cell_voltage
    name: "Battery Maximum Cell Voltage"
    unit_of_measurement: "V"
    state_class: measurement
    device_class: voltage
    accuracy_decimals: 3
    update_interval: never

  - platform: template
    id: battery_min_cell_voltage
    name: "Battery Minimum Cell Voltage"
    unit_of_measurement: "V"
    state_class: measurement
    device_class: voltage
    accuracy_decimals: 3
    update_interval: never

  - platform: template
    id: battery_max_cell_temperature
    name: "Battery Maximum Cell Temperature"
    unit_of_measurement: "°C"
    state_class: measurement
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: battery_min_cell_temperature
    name: "Battery Minimum Cell Temperature"
    unit_of_measurement: "°C"
    state_class: measurement
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: battery_mosfet_temperature
    name: "Battery MOSFET Temperature"
    unit_of_measurement: "°C"
    state_class: measurement
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: battery_max_mosfet_temperature
    name: "Battery Maximum MOSFET Temperature"
    unit_of_measurement: "°C"
    state_class: measurement
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: battery_min_mosfet_temperature
    name: "Battery Minimum MOSFET Temperature"
    unit_of_measurement: "°C"
    state_class: measurement
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: battery_bms_temperature
    name: "Battery BMS Temperature"
    unit_of_measurement: "°C"
    state_class: measurement
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: battery_max_bms_temperature
    name: "Battery Maximum BMS Temperature"
    unit_of_measurement: "°C"
    state_class: measurement
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never

  - platform: template
    id: battery_min_bms_temperature
    name: "Battery Minimum BMS Temperature"
    unit_of_measurement: "°C"
    state_class: measurement
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never

binary_sensor:
  # Online means a checksum-valid frame was received within link_timeout.
  - platform: template
    id: battery_online
    name: "Battery Online"
    device_class: connectivity

  - platform: template
    id: inverter_1_online
    name: "Inverter 1 Online"
    device_class: connectivity

  - platform: template
    id: inverter_2_online
    name: "Inverter 2 Online"
    device_class: connectivity

  - platform: template
    id: battery_charging
    name: "Battery Charging"

  - platform: template
    id: battery_discharging
    name: "Battery Discharging"

text_sensor:
  - platform: template
    id: battery_last_frame
    name: "Battery Last Frame"
    update_interval: never

  - platform: template
    id: battery_last_event
    name: "Battery Last Event"
    update_interval: never

  - platform: template
    id: battery_last_snapshot
    name: "Battery Last Decoded Reply"
    update_interval: never

  - platform: template
    id: inverter_1_last_request
    name: "Inverter 1 Last Request"
    update_interval: never

  - platform: template
    id: inverter_2_last_request
    name: "Inverter 2 Last Request"
    update_interval: never

# ---------------------------------------------------------------------------
# The Home Assistant values in this example are derived from the live battery
# cache populated by actual Pylontech traffic on the battery UART. We do not
# synthesize battery requests just to fill HA values. The values you care about
# are voltage, current, and charge/discharge state from the last valid battery
# snapshot.
# ---------------------------------------------------------------------------
light:
  - platform: esp32_rmt_led_strip
    id: onboard_rgb_led
    name: "Onboard RGB LED"
    pin: GPIO48            # Change to GPIO38 if your board is version v1.1
    num_leds: 1
    channel_colors: GRB
    chipset: WS2812
    restore_mode: ALWAYS_OFF
